[package]
name = "mc-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["blocking"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
sha2 = "0.10"